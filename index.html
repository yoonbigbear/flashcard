<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f6df5">
  <title>플래시카드</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script>
    // 첫 화면이 번쩍이지 않게 CSS 가 적용되기 전에 테마를 정한다. (app.js 의 applyTheme 와 같은 규칙)
    (function () {
      var t = localStorage.getItem('theme') || 'system';
      var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="icon-btn" aria-label="뒤로" hidden>←</button>
    <h1 id="title">플래시카드</h1>
    <span class="topbar-spacer"></span>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button data-tab="decks" class="active">덱</button>
    <button data-tab="search">검색</button>
    <button data-tab="note">오답노트</button>
    <button data-tab="settings">설정</button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script src="storage.js"></script>
  <script src="firebase-config.js"></script>
  <script src="japanese.js"></script>
  <script src="search.js"></script>
  <script src="embed.js"></script>
  <script src="script.js"></script>
  <script src="app.js"></script>
  <script type="module" src="sync.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      // 새 버전이 활성화되면 한 번 자동으로 새로고침해서 바로 반영한다.
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (hadController) location.reload();
      });
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    }
  </script>
</body>
</html>
